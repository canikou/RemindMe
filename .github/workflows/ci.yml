name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-msys2:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check conventions
        shell: pwsh
        run: ./scripts/check-conventions.ps1

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          location: C:\msys64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Configure (CI Debug)
        run: cmake --preset ci-debug

      - name: Build (CI Debug)
        run: cmake --build --preset ci-debug --parallel

      - name: Test (CI Debug)
        run: ctest --preset ci-debug --output-on-failure

      - name: Configure (CI Release)
        run: cmake --preset ci-release

      - name: Build (CI Release)
        run: cmake --build --preset ci-release --parallel

      - name: Test (CI Release)
        run: ctest --preset ci-release --output-on-failure
