name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package portable release
        shell: pwsh
        run: ./scripts/package-portable-release.ps1

      # Launches the packaged app with a system-only PATH and fails if it cannot start.
      - name: Smoke test portable package
        shell: pwsh
        run: ./scripts/smoke-test-package.ps1 -PackageDir (Get-ChildItem dist -Directory -Filter "*-windows-portable").FullName

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package setup installer
        shell: pwsh
        run: ./scripts/package-setup-release.ps1

      - name: Smoke test installed app
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "RemindMe-install"
          $setup = (Get-Item dist/*-setup.exe).FullName
          $proc = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`""
          if ($proc.ExitCode -ne 0) { throw "Installer failed with exit code $($proc.ExitCode)" }
          ./scripts/smoke-test-package.ps1 -PackageDir $installDir

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: RemindMe-windows-packages
          path: |
            dist/*-windows-portable.zip
            dist/*-setup.exe

  linux:
    name: Linux
    # The oldest supported glibc: the AppImage runs on this distro or newer.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package AppImage
        run: ./scripts/package-appimage.sh

      # Starts the AppImage on a virtual X display and fails if it exits during startup.
      - name: Smoke test AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxkbcommon-x11-0 > /dev/null
          export HOME="$RUNNER_TEMP/home" APPIMAGE_EXTRACT_AND_RUN=1 && mkdir -p "$HOME"
          xvfb-run -a bash -c 'dist/*.AppImage & pid=$!; sleep 10; kill -0 $pid && kill $pid'

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: RemindMe-linux-packages
          path: dist/*.AppImage
